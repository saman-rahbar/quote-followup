[project]
name = "quote-followup"
version = "0.1.0"
description = "Tells a service business which open quotes to chase this morning, and why."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8", "pillow>=10"]
notebooks = ["matplotlib>=3.8", "pillow>=10", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29", "jupyterlab>=4.2"]
dev = ["pytest>=8"]

[project.scripts]
quote-followup = "quote_followup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quote_followup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
